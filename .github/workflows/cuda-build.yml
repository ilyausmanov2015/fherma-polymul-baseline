name: CUDA compilation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates python3 python3-pip
          pip3 install 'cmake>=3.24,<4'
      - name: Install NVIDIA cuPQC 0.6.0
        run: |
          curl -fsSL --retry 2 https://developer.nvidia.com/downloads/compute/cupqc/downloads/secure/cupqc-sdk-0.6.0-x86_64.tar.gz -o /tmp/cupqc.tar.gz
          mkdir -p /opt/cupqc
          tar -xzf /tmp/cupqc.tar.gz -C /opt/cupqc
          sdk_include=$(find /opt/cupqc -path '*/include/cupqc/bigint.hpp' -print -quit)
          sdk_root=${sdk_include%/include/cupqc/bigint.hpp}
          test -n "$sdk_root"
          echo "CUPQC_SDK_DIR=$sdk_root" >> "$GITHUB_ENV"
      - name: Compile for Blackwell without a GPU
        run: |
          cmake -B build -DFHERMA_CUDA_ARCH=sm_120 -DFHERMA_RESOURCE_REPORT=ON
          cmake --build build -j2
