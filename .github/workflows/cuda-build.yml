name: CUDA compilation
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Compile variant
        type: choice
        default: default
        options: [default, warp4, warp8, rns, quartic]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates python3 python3-pip
          pip3 install 'cmake>=3.24,<4'
      - name: Check host copy alignment and bounds
        run: |
          g++ -O2 -std=c++17 -I. tests/host_copy.cpp -o /tmp/host-copy-check
          /tmp/host-copy-check
      - name: Check persistent copy handoff
        run: |
          for mode in 0 1; do
            g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=2 -DFHERMA_SPIN_COPY=$mode -DFHERMA_STREAM_COPY=1 tests/host_copy_pool.cpp -o /tmp/host-pool-check
            /tmp/host-pool-check
          done
      - name: Check pipelined input ownership
        run: |
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=2 -DFHERMA_SPIN_COPY=0 tests/input_pipeline.cpp -o /tmp/input-pipeline-check
          /tmp/input-pipeline-check
      - name: Install NVIDIA cuPQC 0.6.0
        run: |
          curl -fsSL --retry 2 https://developer.nvidia.com/downloads/compute/cupqc/downloads/secure/cupqc-sdk-0.6.0-x86_64.tar.gz -o /tmp/cupqc.tar.gz
          mkdir -p /opt/cupqc
          tar -xzf /tmp/cupqc.tar.gz -C /opt/cupqc
          sdk_include=$(find /opt/cupqc -path '*/include/cupqc/bigint.hpp' -print -quit)
          sdk_root=${sdk_include%/include/cupqc/bigint.hpp}
          test -n "$sdk_root"
          echo "CUPQC_SDK_DIR=$sdk_root" >> "$GITHUB_ENV"
      - name: Compile for Blackwell without a GPU
        env:
          COMPILE_VARIANT: ${{ inputs.variant }}
        run: |
          defs=""
          solver="wide"
          case "$COMPILE_VARIANT" in
            warp4) defs="-DFHERMA_MONTGOMERY=1 -DFHERMA_SOA=0 -DFHERMA_TPI=4 -DFHERMA_FUSED_TAIL=0" ;;
            warp8) defs="-DFHERMA_MONTGOMERY=1 -DFHERMA_SOA=0 -DFHERMA_TPI=8 -DFHERMA_FUSED_TAIL=0" ;;
            rns) solver="rns" ;;
            quartic) solver="quartic" ;;
          esac
          cmake -B build "-DFHERMA_SOLVER=$solver" -DFHERMA_CUDA_ARCH=sm_120 -DFHERMA_RESOURCE_REPORT=ON "-DCMAKE_CUDA_FLAGS=$defs"
          cmake --build build -j2
