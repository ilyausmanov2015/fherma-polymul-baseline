name: CUDA compilation
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Compile variant
        type: choice
        default: default
        options: [default, warp4, warp8, rns, quartic]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl ca-certificates python3 python3-pip libgmp-dev
          pip3 install 'cmake>=3.24,<4'
      - name: Check host copy alignment and bounds
        run: |
          g++ -O2 -std=c++17 -I. tests/host_copy.cpp -o /tmp/host-copy-check
          /tmp/host-copy-check
      - name: Check deferred CRT carries against GMP
        run: |
          g++ -O2 -std=c++17 -I. tests/limb_accumulator.cpp -lgmpxx -lgmp -o /tmp/limb-accumulator-check
          /tmp/limb-accumulator-check
      - name: Check asynchronous output ownership and exceptions
        run: |
          g++ -O2 -std=c++17 -pthread -I. tests/host_output_allocator.cpp -o /tmp/output-allocator-check
          /tmp/output-allocator-check
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_OUTPUT_ALLOCATOR_SPIN=1 -DFHERMA_OUTPUT_ALLOCATOR_CPU_INDEX=16 -DFHERMA_HOST_PROFILE=1 tests/host_output_allocator.cpp -o /tmp/output-allocator-spin-check
          /tmp/output-allocator-spin-check
      - name: Check persistent copy handoff
        run: |
          for mode in 0 1; do
            g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=2 -DFHERMA_SPIN_COPY=$mode -DFHERMA_STREAM_COPY=1 tests/host_copy_pool.cpp -o /tmp/host-pool-check
            /tmp/host-pool-check
          done
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=2 -DFHERMA_OUTPUT_THREADS=1 -DFHERMA_SPIN_COPY=1 -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 -DFHERMA_FIRST_CPU=1 tests/host_copy_pool.cpp -o /tmp/host-pool-acks-check
          /tmp/host-pool-acks-check
      - name: Check pipelined input ownership
        run: |
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=2 -DFHERMA_SPIN_COPY=0 tests/input_pipeline.cpp -o /tmp/input-pipeline-check
          /tmp/input-pipeline-check
          for mode in 0 1; do
            g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=2 -DFHERMA_SPIN_COPY=$mode -DFHERMA_COPY_ACKS=1 -DFHERMA_ASYNC_INPUT=1 tests/input_pipeline.cpp -o /tmp/input-async-check
            /tmp/input-async-check
          done
      - name: Check bounded hardware idle waits and fallback
        run: |
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=1 -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 -DFHERMA_UMWAIT=1 tests/host_copy_pool.cpp -o /tmp/idle-pool-check
          /tmp/idle-pool-check
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=1 -DFHERMA_COPY_ACKS=1 -DFHERMA_ASYNC_INPUT=1 -DFHERMA_UMWAIT=1 tests/input_pipeline.cpp -o /tmp/idle-input-check
          /tmp/idle-input-check
      - name: Check physical core placement and copy ownership
        run: |
          g++ -O2 -std=c++17 -I. tests/host_cpu_topology.cpp -o /tmp/core-order-check
          /tmp/core-order-check
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=1 -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 -DFHERMA_PHYSICAL_CORES=1 tests/host_copy_pool.cpp -o /tmp/physical-pool-check
          /tmp/physical-pool-check
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=1 -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 -DFHERMA_PHYSICAL_CORES=2 -DFHERMA_INTERLEAVED_INPUT=1 tests/host_copy_pool.cpp -o /tmp/hybrid-pool-check
          /tmp/hybrid-pool-check
      - name: Check CUDA helper affinity inheritance
        run: |
          g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=2 -DFHERMA_DEFER_MAIN_PIN=1 tests/deferred_affinity.cpp -o /tmp/affinity-check
          /tmp/affinity-check
      - name: Check persistent input segments
        run: |
          for mode in 0 1; do
            g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=$mode -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 -DFHERMA_INPUT_WORKER_PIPELINE=1 tests/input_pipeline.cpp -o /tmp/input-segments-check
            /tmp/input-segments-check
          done
      - name: Check persistent output pipeline and cancellation
        run: |
          for mode in 0 1; do
            g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=$mode -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 tests/output_pipeline.cpp -o /tmp/output-pipeline-check
            /tmp/output-pipeline-check
          done
      - name: Check input copy without caller participation
        run: |
          for mode in 0 1; do
            g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=$mode -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 -DFHERMA_ASYNC_INPUT=1 -DFHERMA_INPUT_WORKERS_ONLY=1 tests/input_pipeline.cpp -o /tmp/input-workers-check
            /tmp/input-workers-check
          done
      - name: Check selective output wakeups
        run: |
          for full in 0 1; do
            g++ -O2 -std=c++17 -pthread -I. -DFHERMA_COPY_THREADS=4 -DFHERMA_OUTPUT_THREADS=2 -DFHERMA_SPIN_COPY=1 -DFHERMA_COPY_ACKS=1 -DFHERMA_MAIN_OUTPUT=1 -DFHERMA_ASYNC_INPUT=1 -DFHERMA_INPUT_WORKERS_ONLY=$full -DFHERMA_SELECTIVE_OUTPUT_WAKE=1 tests/input_pipeline.cpp -o /tmp/selective-output-check
            /tmp/selective-output-check
          done
      - name: Install NVIDIA cuPQC 0.6.0
        run: |
          curl -fsSL --retry 2 https://developer.nvidia.com/downloads/compute/cupqc/downloads/secure/cupqc-sdk-0.6.0-x86_64.tar.gz -o /tmp/cupqc.tar.gz
          mkdir -p /opt/cupqc
          tar -xzf /tmp/cupqc.tar.gz -C /opt/cupqc
          sdk_include=$(find /opt/cupqc -path '*/include/cupqc/bigint.hpp' -print -quit)
          sdk_root=${sdk_include%/include/cupqc/bigint.hpp}
          test -n "$sdk_root"
          echo "CUPQC_SDK_DIR=$sdk_root" >> "$GITHUB_ENV"
      - name: Compile for Blackwell without a GPU
        env:
          COMPILE_VARIANT: ${{ inputs.variant }}
        run: |
          defs=""
          solver="wide"
          case "$COMPILE_VARIANT" in
            warp4) defs="-DFHERMA_MONTGOMERY=1 -DFHERMA_SOA=0 -DFHERMA_TPI=4 -DFHERMA_FUSED_TAIL=0" ;;
            warp8) defs="-DFHERMA_MONTGOMERY=1 -DFHERMA_SOA=0 -DFHERMA_TPI=8 -DFHERMA_FUSED_TAIL=0" ;;
            rns) solver="rns" ;;
            quartic) solver="quartic" ;;
          esac
          cmake -B build "-DFHERMA_SOLVER=$solver" -DFHERMA_CUDA_ARCH=sm_120 -DFHERMA_RESOURCE_REPORT=ON "-DCMAKE_CUDA_FLAGS=$defs"
          cmake --build build -j2
